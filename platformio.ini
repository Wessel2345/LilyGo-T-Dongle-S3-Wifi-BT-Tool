[platformio]
default_envs = T-Dongle-S3

[env:T-Dongle-S3]
platform = espressif32@6.12.0
board = dongles3
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags =
  -DLV_CONF_SKIP
  -DLV_COLOR_DEPTH=16
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=0
lib_deps =
  lvgl/lvgl@9.4.0
  h2zero/NimBLE-Arduino@1.4.3
