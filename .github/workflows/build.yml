name: PlatformIO build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Fetch LilyGO display driver
        run: bash scripts/setup_lilygo_driver.sh
      - name: Build firmware
        run: pio run -e T-Dongle-S3
